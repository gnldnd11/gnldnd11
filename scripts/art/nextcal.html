<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- nextcal 썸네일. 260×190 을 2배로 찍는다(scripts/art.py). 바탕화면 월 달력 + VS Code 상태 표시줄. -->
<style>
@font-face{font-family:P;font-weight:400;src:url(../../fonts/Paperlogy-4Regular.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Paperlogy-6SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Paperlogy-7Bold.woff2)}
html,body{margin:0;width:260px;height:190px;overflow:hidden}
body{font-family:P,sans-serif;color:#E2E8F0;background:linear-gradient(150deg,#1E3A5F 0%,#0F172A 70%);position:relative;-webkit-font-smoothing:antialiased}
.cal{position:absolute;left:16px;right:16px;top:14px;background:#0F172ACC;border:1px solid #33415588;border-radius:12px;padding:10px 11px 8px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hd b{font-size:13px;font-weight:700}
.hd span{font-size:8px;color:#94A3B8;letter-spacing:.08em}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.g i{font-style:normal;font-size:7.5px;color:#94A3B8;height:15px;border-radius:4px;padding:2px 3px;box-sizing:border-box;position:relative;background:#1E293B66}
.g i.w{background:none;height:auto;text-align:center;color:#64748B;font-weight:600}
.g i.o{color:#475569;background:none}
.g i.t{background:#3B82F6;color:#fff;font-weight:700}
.g i u{position:absolute;left:3px;right:3px;bottom:2px;height:2px;border-radius:1px;background:#F59E0B}
.g i u.b{background:#22D3EE}
.bar{white-space:nowrap;position:absolute;left:0;right:0;bottom:0;height:22px;background:#007ACC;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:9px;color:#fff;font-weight:600}
.bar em{font-style:normal;opacity:.75;font-weight:400}
.bar .now{margin-left:auto;background:#ffffff26;padding:2px 7px;border-radius:4px}
/* 움직임 */
.roll{display:inline-block;height:1.2em;line-height:1.2em;overflow:hidden;vertical-align:top}
.col{display:block;animation:roll 8s steps(4) infinite}
@keyframes roll{to{transform:translateY(-4.8em)}}
.g i.t{animation:today 2.6s ease-in-out infinite}
@keyframes today{50%{box-shadow:0 0 0 3px #3B82F655}}
</style></head><body>
<div class="cal">
  <div class="hd"><b>November</b><span>NEXTCAL</span></div>
  <div class="g"><i class="w">S</i><i class="w">M</i><i class="w">T</i><i class="w">W</i><i class="w">T</i><i class="w">F</i><i class="w">S</i><i class="o">26</i><i class="o">27</i><i class="o">28</i><i class="o">29</i><i class="o">30</i><i class="o">31</i><i>1</i><i>2</i><i>3<u></u></i><i>4</i><i>5</i><i>6</i><i>7<u class="b"></u></i><i>8</i><i>9</i><i>10</i><i>11<u></u></i><i>12</i><i>13</i><i>14<u class="b"></u></i><i>15</i><i>16</i><i class="t">17<u></u></i><i>18</i><i>19</i><i>20<u class="b"></u></i><i>21</i><i>22</i></div>
</div>
<div class="bar"><em>main ↻</em><span class="now">◷ 14:00 Weekly sync · in 2<span class="roll"><span class="col">3<br>2<br>1<br>0</span></span>m</span></div>
</body></html>
