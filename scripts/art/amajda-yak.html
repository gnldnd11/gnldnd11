<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 아맞다약 썸네일. 260×190 을 2배로 찍는다(scripts/art.py). 시안 C-1 아일랜드 확장·B-1 오늘 카드를 옮겼다. -->
<style>
@font-face{font-family:P;font-weight:400;src:url(../../fonts/Paperlogy-4Regular.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Paperlogy-6SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Paperlogy-7Bold.woff2)}
html,body{margin:0;width:260px;height:190px;overflow:hidden}
body{font-family:P,sans-serif;background:radial-gradient(130% 120% at 50% 0%,#F7F7F3 0%,#E9EAE3 100%);position:relative;-webkit-font-smoothing:antialiased}
.mono{font-family:"Cascadia Mono",Consolas,monospace;font-weight:700}
.phone{position:absolute;left:30px;right:30px;top:14px;height:220px;border-radius:34px;background:#DCDDD6;box-shadow:inset 0 0 0 5px #1B1B1D,0 10px 30px #0000002a}
.isl{position:absolute;left:12px;right:12px;top:11px;background:#000;border-radius:24px;padding:12px 13px 12px;color:#fff;display:flex;flex-direction:column;gap:9px}
.cam{position:absolute;left:50%;top:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#1C1C1E}
.hd{display:flex;align-items:center;gap:9px}
.eyes{display:flex;gap:4px}
.eyes i{width:9px;height:13px;border-radius:5px;background:#5BE38A;box-shadow:0 0 6px #5BE38A88}
.t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.t b{font-size:11px;font-weight:700;white-space:nowrap}
.t span{font-size:8.5px;color:#A1A1A6}
.cd{font-size:15px;color:#5BE38A;letter-spacing:-.02em}
.pills{display:flex;align-items:center;gap:6px;background:#1C1C1E;border-radius:10px;padding:6px 8px}
.p1{width:13px;height:13px;border-radius:50%;background:#F4F4F1;border:1px solid #CFCFCA;box-sizing:border-box;position:relative}
.p1:after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1.5px;background:#9A9A95;transform:rotate(-25deg)}
.p2{width:18px;height:11px;border-radius:50%;background:#F2C94C;box-shadow:inset 0 -2px 0 #D9AE2C}
.p3{width:18px;height:8px;border-radius:5px;background:linear-gradient(90deg,#F4F4F1 50%,#F28FA8 50%);transform:rotate(-30deg)}
.pills em{margin-left:auto;white-space:nowrap;font-style:normal;font-size:8px;color:#A1A1A6}
.btn{display:flex;gap:6px}
.btn span{flex:1;text-align:center;font-size:10px;font-weight:700;padding:6px 0;border-radius:999px}
/* 움직임 */
.cd{line-height:1.2em}
.roll{display:inline-block;height:1.2em;overflow:hidden;vertical-align:top}
.col{display:block;animation:roll 10s steps(10) infinite}
@keyframes roll{to{transform:translateY(-12em)}}
.eyes i{animation:blink 4.5s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
.go{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 14px #5BE38Acc}}
.p1,.p2,.p3{animation:bob 3s ease-in-out infinite}.p2{animation-delay:.4s}.p3{animation-delay:.8s}
@keyframes bob{50%{translate:0 -2px}}
</style></head><body>
<div class="phone">
  <div class="isl">
    <div class="cam"></div>
    <div class="hd">
      <div class="eyes"><i></i><i></i></div>
      <div class="t"><b>Breakfast · 3</b><span>Take at 08:22</span></div>
      <div class="cd mono">04:5<span class="roll"><span class="col">9<br>8<br>7<br>6<br>5<br>4<br>3<br>2<br>1<br>0</span></span></div>
    </div>
    <div class="pills"><span class="p1"></span><span class="p2"></span><span class="p3"></span><em>After meal</em></div>
    <div class="btn"><span class="go" style="background:#5BE38A;color:#0B2A16">Take all</span><span style="background:#2C2C2E;color:#E5E5EA">In 10 min</span></div>
  </div>
</div>
</body></html>
