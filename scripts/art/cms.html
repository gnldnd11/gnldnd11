<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 배터리 셀 검사 HMI 썸네일. 402×190 을 2배로 찍는다(scripts/art.py). -->
<style>
@font-face{font-family:P;font-weight:400;src:url(../../fonts/Paperlogy-4Regular.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Paperlogy-6SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Paperlogy-7Bold.woff2)}
html,body{margin:0;width:402px;height:190px;overflow:hidden}
body{font-family:P,sans-serif;color:#E6EDF3;background:radial-gradient(120% 140% at 85% 50%,#0F2A22 0%,#0A1016 55%,#070B10 100%);position:relative;-webkit-font-smoothing:antialiased}
body:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:12px 12px}
.l{position:absolute;left:20px;top:18px;bottom:16px;width:170px;display:flex;flex-direction:column}
.k{font-size:9px;font-weight:600;letter-spacing:.16em;color:#5EEAD4}
.big{display:flex;align-items:baseline;gap:5px;margin-top:6px}
.big b{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:.9;color:#fff}
.big span{font-size:15px;font-weight:700;color:#8B98A5}
.sub{font-size:11px;color:#8B98A5;margin-top:6px}
.lg{display:flex;gap:10px;font-size:9px;color:#8B98A5;margin:auto 0 10px}
.lg span{display:flex;align-items:center;gap:4px}.lg i{width:7px;height:7px;border-radius:2px}
.fsm{display:flex;gap:3px}
.fsm i{flex:1;height:6px;border-radius:2px;background:#1E2A33}
.fsm i.d{background:#2DD4BF55}.fsm i.c{background:#5EEAD4;box-shadow:0 0 8px #5EEAD4}
.st{display:flex;justify-content:space-between;font-size:9px;font-weight:600;color:#8B98A5;margin-top:6px;letter-spacing:.06em}
.st em{font-style:normal;color:#5EEAD4}
.g{position:absolute;right:20px;top:15px;display:grid;grid-template-columns:repeat(16,8px);gap:2px}
.g i{width:8px;height:8px;border-radius:2px}
</style></head><body>
<div class="l">
  <div class="k">CELL INSPECTION</div>
  <div class="big"><b>256</b><span>CH</span></div>
  <div class="sub">PLC · 계측기 연동 자동 순회</div>
  <div class="lg"><span><i style="background:#22C55E"></i>OK</span><span><i style="background:#F43F5E"></i>NG</span><span><i style="background:#5EEAD4"></i>측정 중</span></div>
  <div class="fsm" id="fsm"></div>
  <div class="st"><span>FSM 11-STATE</span><em>07 MEASURE</em></div>
</div>
<div class="g" id="g"></div>
<script>
let s = 7;
const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
const g = document.getElementById("g"), N = 173, NG = [38, 91, 150];
for (let k = 0; k < 256; k++) {
  const i = document.createElement("i");
  if (k < N) {
    const bad = NG.includes(k);
    i.style.background = bad ? "#F43F5E" : "rgba(34,197,94," + (0.45 + r() * 0.55).toFixed(2) + ")";
    if (bad) i.style.boxShadow = "0 0 6px #F43F5E";
  } else if (k === N) {
    i.style.background = "#5EEAD4";
    i.style.boxShadow = "0 0 10px #5EEAD4, 0 0 2px #fff";
  } else i.style.background = "#18222B";
  g.appendChild(i);
}
const f = document.getElementById("fsm");
for (let k = 0; k < 11; k++) {
  const i = document.createElement("i");
  if (k < 6) i.className = "d";
  if (k === 6) i.className = "c";
  f.appendChild(i);
}
</script>
</body></html>
