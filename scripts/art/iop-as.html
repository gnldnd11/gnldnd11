<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 생성형 AI 행정비서 썸네일. 402×190 을 2배로 찍는다(scripts/art.py). -->
<style>
@font-face{font-family:P;font-weight:400;src:url(../../fonts/Paperlogy-4Regular.woff2)}
@font-face{font-family:P;font-weight:600;src:url(../../fonts/Paperlogy-6SemiBold.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../fonts/Paperlogy-7Bold.woff2)}
html,body{margin:0;width:402px;height:190px;overflow:hidden}
body{font-family:P,sans-serif;color:#1E1B4B;background:linear-gradient(135deg,#EEF2FF 0%,#E0E7FF 45%,#F3E8FF 100%);position:relative;-webkit-font-smoothing:antialiased}
.orb{position:absolute;border-radius:50%;filter:blur(30px)}
.chat{position:absolute;left:24px;right:24px;top:14px;display:flex;flex-direction:column;gap:7px}
.me{align-self:flex-end;background:#4F46E5;color:#fff;font-size:11px;font-weight:600;padding:7px 11px;border-radius:12px 12px 3px 12px;box-shadow:0 4px 12px #4F46E540}
.row{display:flex;gap:7px;align-items:flex-start}
.av{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6366F1,#A855F7);flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
.ai{background:#fff;font-size:11px;padding:7px 11px;border-radius:3px 12px 12px 12px;box-shadow:0 4px 14px #312E8114;color:#312E81;line-height:1.45}
.cur{display:inline-block;width:6px;height:11px;background:#6366F1;vertical-align:-1px;margin-left:2px;border-radius:1px}
.tag{font-size:8px;font-weight:700;letter-spacing:.12em;padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}
.card{margin-left:29px;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 6px 18px #312E811A;display:flex;flex-direction:column;gap:8px}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:700;color:#1E1B4B}
.steps{display:flex;align-items:center}
.sp{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:#6B7280;white-space:nowrap}
.dot{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;font-size:8px;color:#fff;font-weight:700;box-sizing:border-box}
.ok{color:#065F46}.ok .dot{background:#10B981}
.now{color:#92400E}.now .dot{background:#fff;border:2px solid #F59E0B}
.wait .dot{background:#E5E7EB}
.ln{flex:1;height:2px;background:#E5E7EB;margin:0 5px;min-width:8px}.ln.on{background:#10B981}
.bar{height:4px;border-radius:2px;background:#EEF2FF;overflow:hidden}.bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#10B981,#F59E0B)}
</style></head><body>
<div class="orb" style="width:140px;height:140px;background:#A5B4FC;left:-40px;top:90px;opacity:.5"></div>
<div class="orb" style="width:120px;height:120px;background:#D8B4FE;right:-30px;top:-40px;opacity:.6"></div>
<div class="chat">
  <div class="me">이사했는데 전입신고 좀 대신 해 줘</div>
  <div class="row"><div class="av">AI</div><div class="ai">주소 확인했어요. 신청서를 채워 접수할게요<span class="cur"></span><span class="tag" style="background:#EEF2FF;color:#4F46E5">STREAM</span></div></div>
  <div class="card">
    <div class="hd"><span>민원 처리 자동화</span><span class="tag" style="background:#FEF3C7;color:#B45309;margin:0">RPA</span></div>
    <div class="steps">
      <div class="sp ok"><span class="dot">✓</span>로그인</div><div class="ln on"></div>
      <div class="sp ok"><span class="dot">✓</span>조회</div><div class="ln on"></div>
      <div class="sp now"><span class="dot"></span>서류 작성</div><div class="ln"></div>
      <div class="sp wait"><span class="dot"></span>접수</div>
    </div>
    <div class="bar"><i></i></div>
  </div>
</div>
</body></html>
