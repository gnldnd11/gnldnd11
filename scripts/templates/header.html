<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 300px; overflow: hidden; }
  body {
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color: $text;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    position: relative; width: 1200px; height: 300px; border-radius: 18px; overflow: hidden;
    background: $canvas;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 420px at 88% -30%, $glow, transparent 60%),
      radial-gradient(600px 260px at 12% 120%, $glow, transparent 65%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .35;
    background-image:
      linear-gradient($line 1px, transparent 1px),
      linear-gradient(90deg, $line 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(800px 300px at 70% 40%, #000 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(800px 300px at 70% 40%, #000 20%, transparent 80%);
  }
  .inner { position: absolute; inset: 0; padding: 54px 64px; box-sizing: border-box; }
  .label {
    display: flex; align-items: center; gap: 18px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 700; letter-spacing: .28em; color: $accent;
  }
  .label i { display: block; height: 1px; width: 160px; background: linear-gradient(90deg, $accent, transparent); }
  .name { margin-top: 22px; font-size: 62px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tag { margin-top: 18px; font-size: 24px; font-weight: 600; color: $muted; letter-spacing: -.01em; }
  .tag b { color: $text; font-weight: 700; }
  .flow {
    position: absolute; right: 64px; top: 58px;
    display: flex; align-items: center; gap: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: .06em;
  }
  .flow .step {
    padding: 9px 14px; border: 1px solid $line; border-radius: 8px; color: $muted; background: $paper;
  }
  .flow .step.on { color: $accent; border-color: $accent; }
  .flow .link { width: 26px; height: 1px; background: $line; }
  .foot {
    position: absolute; right: 64px; bottom: 44px;
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: .06em; color: $dim;
  }
  .foot b { color: $accent; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="inner">
    <div class="label">AUTONOMOUS DEV STUDIO <i></i></div>
    <div class="name">김휘웅</div>
    <div class="tag"><b>Set the direction.</b> The rest runs itself.</div>
    <div class="flow">
      <span class="step">수집</span><span class="link"></span>
      <span class="step">기록</span><span class="link"></span>
      <span class="step">지식</span><span class="link"></span>
      <span class="step on">운영</span>
    </div>
    <div class="foot">0to<b>1</b>.saegim.studio</div>
  </div>
</div>
</body>
</html>
