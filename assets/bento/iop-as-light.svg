-radius:50%;display:grid;place-items:center;font-size:8px;color:#fff;font-weight:700;box-sizing:border-box}.art-iop-as .ok{color:#065F46}.art-iop-as .ok .dot{background:#10B981}.art-iop-as .now{color:#92400E}.art-iop-as .now .dot{background:#fff;border:2px solid #F59E0B}.art-iop-as .wait .dot{background:#E5E7EB}.art-iop-as .ln{flex:1;height:2px;background:#E5E7EB;margin:0 5px;min-width:8px}.art-iop-as .ln.on{background:#10B981}.art-iop-as .bar{height:4px;border-radius:2px;background:#EEF2FF;overflow:hidden}.art-iop-as .bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#10B981,#F59E0B)}.art-iop-as .type{display:inline-block;vertical-align:bottom;white-space:nowrap;overflow:hidden;max-width:180px;animation:type 7s steps(30) infinite}@keyframes type{0%{max-width:0}55%,100%{max-width:180px}}.art-iop-as .cur{animation:cur 1s steps(2) infinite}@keyframes cur{50%{opacity:0}}.art-iop-as .bar i{animation:prog 7s ease-in-out infinite}@keyframes prog{0%,20%{width:40%}80%,100%{width:82%}}.art-iop-as .now .dot{border-top-color:#FDE68A;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style><div class="art-iop-as" style="position:absolute;left:0;top:-2.36px;width:402px;height:190px;transform:scale(1.0249);transform-origin:0 0;overflow:hidden">
